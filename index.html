<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EstruturaViva — visualize pilhas e listas encadeadas passo a passo, com código sincronizado, previsões e quizzes."
    />
    <title>EstruturaViva — estruturas de dados passo a passo</title>
    <!--
      Aplica o tema salvo antes do primeiro desenho, para não piscar o tema claro
      enquanto o React carrega. Mesmas chaves e padrão de src/components/site/theme.ts.
    -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("estruturaviva-theme") || localStorage.getItem("structuralab-theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
